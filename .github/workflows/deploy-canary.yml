name: Deploy Canary

on:
  workflow_dispatch:
    inputs:
      module:
        description: Acurast module to deploy
        required: true
        type: choice
        options:
          - hello
          - coordinator
      dry_run:
        description: Dry run only (no on-chain deploy)
        required: false
        type: boolean
        default: false
      relay_url_override:
        description: "Hello A/B only: override RELAY_URL (e.g. wss://relay.damus.io/). Sets RELAY_SKIP_WHITELIST=1. Empty = production RELAY_HOSTNAME."
        required: false
        type: string
        default: ""
      minimal_smoke:
        description: "Hello only: HELLO_MINIMAL=1 — console.log start/done only (no Nostr/network). Skips heartbeat smoke."
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-canary-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  compute-acu-txt:
    name: compute-acu-txt
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: canary
    outputs:
      acu_txt_v: ${{ steps.compute.outputs.acu_txt_v }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Compute Acurast TXT values
        id: compute
        env:
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          ACURAST_MNEMONIC_HELLO: ${{ secrets.ACURAST_MNEMONIC_HELLO }}
          ACURAST_MNEMONIC_COORDINATOR: ${{ secrets.ACURAST_MNEMONIC_COORDINATOR }}
          ACURAST_MNEMONIC: ${{ secrets.ACURAST_MNEMONIC }}
        run: |
          set -euo pipefail
          if [ -z "${RELAY_HOSTNAME:-}" ]; then
            echo "::error::Missing RELAY_HOSTNAME in environment canary"
            exit 1
          fi
          values="$(bash scripts/compute-relay-acu-txt-values.sh)"
          {
            echo "acu_txt_v<<EOF"
            printf '%s' "${values}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  upsert-acu-txt:
    name: upsert-acu-txt
    if: inputs.dry_run == false
    needs: compute-acu-txt
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Ensure PTR (Acurast reverse whitelist)
        env:
          SELECTEL_STATIC_TOKEN: ${{ secrets.SELECTEL_STATIC_TOKEN }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: |
          set -euo pipefail
          bash infra/selectel/scripts/ensure-relay-ptr.sh

      - name: Upsert _acu TXT in Selectel DNS
        env:
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          ACURAST_TXT_V: ${{ needs.compute-acu-txt.outputs.acu_txt_v }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_IAM_PROJECT_NAME: ${{ secrets.SELECTEL_IAM_PROJECT_NAME }}
          RELAY_DNS_ZONE: ${{ secrets.RELAY_DNS_ZONE }}
          RELAY_DNS_ZONE_ID: ${{ secrets.RELAY_DNS_ZONE_ID }}
        run: |
          set -euo pipefail
          export PREPARE_OPENSTACK_EXPORT=1
          # shellcheck disable=SC1091
          source infra/selectel/scripts/prepare-openstack-env.sh
          bash infra/selectel/scripts/upsert-relay-acu-txt.sh

      - name: Verify _acu TXT propagation
        env:
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          ACURAST_TXT_V: ${{ needs.compute-acu-txt.outputs.acu_txt_v }}
        run: bash infra/selectel/scripts/verify-relay-acu-txt.sh

  deploy:
    name: deploy-${{ inputs.module }}
    needs: upsert-acu-txt
    if: always() && (inputs.dry_run == true || needs.upsert-acu-txt.result == 'success')
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Install and bundle
        run: |
          docker compose run --rm dev npm ci --prefix packages/nostr-client
          docker compose run --rm dev npm run build --prefix packages/nostr-client
          docker compose run --rm dev npm ci --prefix modules/${{ inputs.module }}
          docker compose run --rm dev npm run bundle --prefix modules/${{ inputs.module }}

      - name: Write module .env from secrets
        id: module_env
        env:
          MNEMONIC_HELLO: ${{ secrets.ACURAST_MNEMONIC_HELLO }}
          MNEMONIC_COORDINATOR: ${{ secrets.ACURAST_MNEMONIC_COORDINATOR }}
          MNEMONIC_FALLBACK: ${{ secrets.ACURAST_MNEMONIC }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          RELAY_URL_OVERRIDE: ${{ inputs.relay_url_override }}
          HELLO_MINIMAL_SMOKE: ${{ inputs.minimal_smoke }}
        run: |
          set -euo pipefail
          MODULE="${{ inputs.module }}"
          case "${MODULE}" in
            hello) MNEMONIC="${MNEMONIC_HELLO:-${MNEMONIC_FALLBACK:-}}" ;;
            coordinator) MNEMONIC="${MNEMONIC_COORDINATOR:-${MNEMONIC_FALLBACK:-}}" ;;
            *) echo "Unknown module: ${MODULE}" >&2; exit 1 ;;
          esac
          if [ -z "${MNEMONIC}" ]; then
            echo "Missing mnemonic secret for ${MODULE}." >&2
            echo "Set ACURAST_MNEMONIC_${MODULE^^} or ACURAST_MNEMONIC in environment canary." >&2
            exit 1
          fi
          relay_override="$(printf '%s' "${RELAY_URL_OVERRIDE:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "${relay_override}" ]; then
            if [ "${MODULE}" != "hello" ]; then
              echo "::error::relay_url_override is only supported for module hello" >&2
              exit 1
            fi
            if ! printf '%s' "${relay_override}" | grep -Eq '^wss://[^/[:space:]]+/?$'; then
              echo "::error::relay_url_override must be wss://<host>/ (e.g. wss://relay.damus.io/)" >&2
              exit 1
            fi
            relay_url="${relay_override%/}/"
            smoke_hostname="$(printf '%s' "${relay_url}" | sed -E 's|^wss://([^/]+)/?$|\1|' | tr '[:upper:]' '[:lower:]')"
            relay_ab_mode="public"
            echo "::notice::Hello A/B: RELAY_URL=${relay_url} (RELAY_SKIP_WHITELIST=1); smoke on ${smoke_hostname}"
          else
            relay_hostname="$(printf '%s' "${RELAY_HOSTNAME:-}" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s|/$||')"
            if [ -z "${relay_hostname}" ]; then
              echo "::error::Missing RELAY_HOSTNAME in environment canary (FQDN without scheme)" >&2
              exit 1
            fi
            if ! printf '%s' "${relay_hostname}" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'; then
              echo "::error::Invalid RELAY_HOSTNAME format (expected lowercase FQDN)" >&2
              exit 1
            fi
            relay_url="wss://${relay_hostname}/"
            smoke_hostname="${relay_hostname}"
            relay_ab_mode="production"
            echo "RELAY_URL derived from RELAY_HOSTNAME (wss://<host>/)" >&2
          fi
          ENV_FILE="modules/${MODULE}/.env"
          printf 'ACURAST_MNEMONIC=%s\n' "${MNEMONIC}" > "${ENV_FILE}"
          printf 'ACURAST_RPC=wss://public-rpc.canary.acurast.com\n' >> "${ENV_FILE}"
          printf 'ACURAST_CANARY_RPC=wss://public-rpc.canary.acurast.com\n' >> "${ENV_FILE}"
          printf 'ACURAST_CANARY_INDEXER=https://dev.indexer.canary.acurast.com/api/v1/rpc\n' >> "${ENV_FILE}"
          printf 'ACURAST_CANARY_INDEXER_API_KEY=OXuwySHqNSlwwa_qqB-cBw\n' >> "${ENV_FILE}"
          printf 'RELAY_URL=%s\n' "${relay_url}" >> "${ENV_FILE}"
          if [ "${relay_ab_mode}" = "public" ]; then
            printf 'RELAY_SKIP_WHITELIST=1\n' >> "${ENV_FILE}"
          fi
          if [ "${MODULE}" = "coordinator" ]; then
            printf 'COORDINATOR_WATCH_MODULES=hello\n' >> "${ENV_FILE}"
          fi
          minimal_smoke="$(printf '%s' "${HELLO_MINIMAL_SMOKE:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "${minimal_smoke}" = "true" ]; then
            if [ "${MODULE}" != "hello" ]; then
              echo "::error::minimal_smoke is only supported for module hello" >&2
              exit 1
            fi
            printf 'HELLO_MINIMAL=1\n' >> "${ENV_FILE}"
            echo "::notice::Hello minimal smoke: HELLO_MINIMAL=1 (no Nostr/network); heartbeat smoke skipped"
          fi
          {
            echo "smoke_relay_hostname=${smoke_hostname}"
            echo "relay_ab_mode=${relay_ab_mode}"
            echo "hello_minimal_smoke=${minimal_smoke}"
          } >> "${GITHUB_OUTPUT}"

      - name: Preflight hello heartbeat (coordinator deploy)
        if: inputs.module == 'coordinator' && inputs.dry_run == false
        env:
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          PREFLIGHT_TIMEOUT_MS: "120000"
        run: bash scripts/preflight-hello-heartbeat.sh "${RELAY_HOSTNAME}" hello

      - name: Estimate fee
        run: |
          docker compose run --rm \
            -e ACURAST_CANARY_RPC=wss://public-rpc.canary.acurast.com \
            dev bash -lc "cd modules/${{ inputs.module }} && acurast estimate-fee"

      - name: Deploy to Acurast canary
        id: acurast_deploy
        env:
          ACURAST_DEPLOY_TIMEOUT_SEC: "300"
        run: |
          set -euo pipefail
          deploy_out="$(bash scripts/deploy-canary-acurast.sh "${{ inputs.module }}" "${{ inputs.dry_run }}")"
          printf '%s\n' "${deploy_out}"
          deployment_id="$(printf '%s\n' "${deploy_out}" | grep -E '^deployment_id=' | tail -1 | cut -d= -f2- || true)"
          if [ -n "${deployment_id}" ]; then
            echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
            echo "Parsed deployment_id=${deployment_id}"
          else
            echo "::warning::Could not parse deployment ID from acurast deploy output"
          fi

      - name: Inspect deployment (SDK + CLI, registered)
        if: inputs.dry_run == false && steps.acurast_deploy.outputs.deployment_id != ''
        run: |
          bash scripts/inspect-canary-deployments.sh \
            "${{ inputs.module }}" \
            "${{ steps.acurast_deploy.outputs.deployment_id }}" \
            || echo "::warning::Deployment status inspect failed (registered)"

      - name: Upload Acurast deployment files
        if: inputs.dry_run == false && steps.acurast_deploy.outputs.deployment_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: acurast-deploy-${{ inputs.module }}-${{ steps.acurast_deploy.outputs.deployment_id }}
          path: modules/${{ inputs.module }}/.acurast/deploy/
          if-no-files-found: warn

      - name: Acurast CLI deployment detail
        if: inputs.dry_run == false && steps.acurast_deploy.outputs.deployment_id != ''
        run: |
          bash scripts/inspect-canary-deployment-cli.sh \
            "${{ inputs.module }}" \
            "${{ steps.acurast_deploy.outputs.deployment_id }}" \
            || echo "::warning::CLI deployment detail failed"

      - name: Smoke hello heartbeat on relay
        if: inputs.module == 'hello' && inputs.dry_run == false && inputs.minimal_smoke == false
        env:
          RELAY_SMOKE_HOSTNAME: ${{ steps.module_env.outputs.smoke_relay_hostname }}
          RELAY_AB_MODE: ${{ steps.module_env.outputs.relay_ab_mode }}
          WAIT_BEFORE_SMOKE_SEC: "390"
          SMOKE_EXECUTION_MARGIN_SEC: "90"
          PREFLIGHT_TIMEOUT_MS: "300000"
        run: |
          set -euo pipefail
          if [ -z "${RELAY_SMOKE_HOSTNAME:-}" ]; then
            echo "::error::Missing smoke relay hostname from module_env step" >&2
            exit 1
          fi
          echo "Hello smoke relay A/B mode: ${RELAY_AB_MODE:-production} → ${RELAY_SMOKE_HOSTNAME}"
          wait_sec="${WAIT_BEFORE_SMOKE_SEC}"
          if [ -f /tmp/acurast-deploy.log ]; then
            scheduled="$(grep -oE 'first execution scheduled in [0-9]+s' /tmp/acurast-deploy.log | tail -1 | grep -oE '[0-9]+' || true)"
            if [ -n "${scheduled}" ]; then
              wait_sec=$((scheduled + SMOKE_EXECUTION_MARGIN_SEC))
              echo "Parsed first execution in ${scheduled}s → waiting ${wait_sec}s before smoke (margin ${SMOKE_EXECUTION_MARGIN_SEC}s)"
            fi
          fi
          echo "Waiting ${wait_sec}s before hello smoke preflight..."
          sleep "${wait_sec}"
          if [ -n "${{ steps.acurast_deploy.outputs.deployment_id }}" ]; then
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Deployment status (SDK + CLI, post-execution)"
                echo ""
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
            echo "Querying deployment status via SDK + CLI (post-execution)..."
            bash scripts/inspect-canary-deployments.sh hello "${{ steps.acurast_deploy.outputs.deployment_id }}" \
              || echo "::warning::Deployment inspect failed (post-execution)"
          fi
          echo "Running single hello heartbeat preflight (timeout ${PREFLIGHT_TIMEOUT_MS}ms)..."
          bash scripts/preflight-hello-heartbeat.sh "${RELAY_SMOKE_HOSTNAME}" hello
      - name: Inspect deployment post-window (minimal smoke)
        if: inputs.module == 'hello' && inputs.dry_run == false && inputs.minimal_smoke == true && steps.acurast_deploy.outputs.deployment_id != ''
        env:
          WAIT_BEFORE_INSPECT_SEC: "390"
          INSPECT_EXECUTION_MARGIN_SEC: "90"
        run: |
          set -euo pipefail
          wait_sec="${WAIT_BEFORE_INSPECT_SEC}"
          if [ -f /tmp/acurast-deploy.log ]; then
            scheduled="$(grep -oE 'first execution scheduled in [0-9]+s' /tmp/acurast-deploy.log | tail -1 | grep -oE '[0-9]+' || true)"
            if [ -n "${scheduled}" ]; then
              wait_sec=$((scheduled + INSPECT_EXECUTION_MARGIN_SEC))
              echo "Parsed first execution in ${scheduled}s → waiting ${wait_sec}s before post-window inspect"
            fi
          fi
          echo "Hello minimal smoke: waiting ${wait_sec}s (no heartbeat smoke)..."
          sleep "${wait_sec}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Deployment status (SDK + CLI, minimal smoke post-window)"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          bash scripts/inspect-canary-deployments.sh hello "${{ steps.acurast_deploy.outputs.deployment_id }}"

      - name: Smoke coordinator on relay (registry + scorecard)
        if: inputs.module == 'coordinator' && inputs.dry_run == false
        env:
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          COORDINATOR_PUBKEY: ${{ secrets.COORDINATOR_PUBKEY }}
        run: |
          set -euo pipefail
          echo "Waiting 360s for processor match + 75s for first coordinator interval..."
          sleep 360
          sleep 75
          if [ -n "${{ steps.acurast_deploy.outputs.deployment_id }}" ]; then
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Deployment status (SDK + CLI, post-execution)"
                echo ""
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
            bash scripts/inspect-canary-deployments.sh coordinator "${{ steps.acurast_deploy.outputs.deployment_id }}" \
              || echo "::warning::Deployment inspect failed (post-execution)"
          fi
          bash scripts/smoke-coordinator-relay.sh "${RELAY_HOSTNAME}" hello
