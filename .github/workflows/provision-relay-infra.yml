name: Provision Relay Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      set_ptr:
        description: Create/update PTR after apply (requires floating IP)
        required: false
        type: boolean
        default: true
      extra_ssh_cidr:
        description: Optional extra CIDR for SSH, e.g. 203.0.113.10/32
        required: false
        type: string
        default: ""
      flavor_id:
        description: Selectel flavor ID override (pool-specific; empty = auto 2 vCPU / 2GB)
        required: false
        type: string
        default: ""

concurrency:
  group: provision-relay-infra
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform-${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: relay
    defaults:
      run:
        working-directory: infra/selectel/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch GitHub Actions egress CIDRs
        id: meta
        run: |
          set -euo pipefail
          CIDR_JSON="$(curl -fsSL https://api.github.com/meta | jq -c '.actions')"
          if [ -z "${CIDR_JSON}" ] || [ "${CIDR_JSON}" = "null" ]; then
            echo "::error::Failed to read actions CIDRs from api.github.com/meta"
            exit 1
          fi
          echo "cidrs=${CIDR_JSON}" >> "${GITHUB_OUTPUT}"
          echo "Loaded $(echo "${CIDR_JSON}" | jq 'length') GitHub Actions CIDR prefixes"

      - name: Build extra SSH CIDR JSON
        id: extra_ssh
        env:
          EXTRA_SSH_CIDR: ${{ inputs.extra_ssh_cidr }}
        run: |
          set -euo pipefail
          if [ -n "${EXTRA_SSH_CIDR}" ]; then
            echo "json=[\"${EXTRA_SSH_CIDR}\"]" >> "${GITHUB_OUTPUT}"
          else
            echo "json=[]" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Write S3 backend config
        env:
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: |
          set -euo pipefail
          umask 077
          S3_REGION="${TF_STATE_S3_REGION:-}"
          if [ -z "${S3_REGION}" ]; then
            S3_REGION="${SELECTEL_REGION:-}"
          fi
          if [ -z "${S3_REGION}" ] && [ -n "${SELECTEL_AVAILABILITY_ZONE:-}" ]; then
            S3_REGION="${SELECTEL_AVAILABILITY_ZONE%?}"
          fi
          if [ -z "${S3_REGION}" ]; then
            echo "::error::Set TF_STATE_S3_REGION (e.g. ru-3) or SELECTEL_REGION / SELECTEL_AVAILABILITY_ZONE"
            exit 1
          fi
          S3_ENDPOINT="https://s3.${S3_REGION}.storage.selcloud.ru"
          echo "Terraform state S3 pool: ${S3_REGION} (${S3_ENDPOINT})"
          cat > backend.ci.hcl <<EOF
          bucket     = "${TF_STATE_S3_BUCKET}"
          access_key = "${TF_STATE_S3_ACCESS_KEY}"
          secret_key = "${TF_STATE_S3_SECRET_KEY}"
          region     = "${S3_REGION}"
          endpoints = {
            s3 = "${S3_ENDPOINT}"
          }
          EOF

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.ci.hcl
          rm -f backend.ci.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        env:
          TF_VAR_selectel_account_id: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          TF_VAR_selectel_project_id: ${{ secrets.SELECTEL_PROJECT_ID }}
          TF_VAR_selectel_service_user: ${{ secrets.SELECTEL_SERVICE_USER }}
          TF_VAR_selectel_service_password: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          TF_VAR_selectel_region: ${{ secrets.SELECTEL_REGION }}
          TF_VAR_availability_zone: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
          TF_VAR_deploy_ssh_public_key: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_github_actions_cidrs: ${{ steps.meta.outputs.cidrs }}
          TF_VAR_extra_ssh_cidrs: ${{ steps.extra_ssh.outputs.json }}
          TF_VAR_flavor_id: ${{ inputs.flavor_id }}
        run: |
          set -euo pipefail
          if [ -z "${TF_VAR_selectel_region}" ]; then
            TF_VAR_selectel_region="${TF_VAR_availability_zone%?}"
            export TF_VAR_selectel_region
            echo "Derived SELECTEL_REGION=${TF_VAR_selectel_region} from availability zone"
          fi
          terraform plan -out=tfplan -no-color | tee plan.txt

      - name: Terraform apply
        if: inputs.action == 'apply'
        env:
          TF_VAR_selectel_account_id: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          TF_VAR_selectel_project_id: ${{ secrets.SELECTEL_PROJECT_ID }}
          TF_VAR_selectel_service_user: ${{ secrets.SELECTEL_SERVICE_USER }}
          TF_VAR_selectel_service_password: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          TF_VAR_selectel_region: ${{ secrets.SELECTEL_REGION }}
          TF_VAR_availability_zone: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
          TF_VAR_deploy_ssh_public_key: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_github_actions_cidrs: ${{ steps.meta.outputs.cidrs }}
          TF_VAR_extra_ssh_cidrs: ${{ steps.extra_ssh.outputs.json }}
          TF_VAR_flavor_id: ${{ inputs.flavor_id }}
        run: |
          set -euo pipefail
          if [ -z "${TF_VAR_selectel_region}" ]; then
            TF_VAR_selectel_region="${TF_VAR_availability_zone%?}"
            export TF_VAR_selectel_region
          fi
          terraform apply -auto-approve tfplan

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        env:
          TF_VAR_selectel_account_id: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          TF_VAR_selectel_project_id: ${{ secrets.SELECTEL_PROJECT_ID }}
          TF_VAR_selectel_service_user: ${{ secrets.SELECTEL_SERVICE_USER }}
          TF_VAR_selectel_service_password: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          TF_VAR_selectel_region: ${{ secrets.SELECTEL_REGION }}
          TF_VAR_availability_zone: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
          TF_VAR_deploy_ssh_public_key: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_github_actions_cidrs: ${{ steps.meta.outputs.cidrs }}
          TF_VAR_extra_ssh_cidrs: ${{ steps.extra_ssh.outputs.json }}
          TF_VAR_flavor_id: ${{ inputs.flavor_id }}
        run: |
          set -euo pipefail
          if [ -z "${TF_VAR_selectel_region}" ]; then
            TF_VAR_selectel_region="${TF_VAR_availability_zone%?}"
            export TF_VAR_selectel_region
          fi
          terraform destroy -auto-approve

      - name: Set PTR record
        if: inputs.action == 'apply' && inputs.set_ptr
        env:
          SELECTEL_STATIC_TOKEN: ${{ secrets.SELECTEL_STATIC_TOKEN }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
        working-directory: infra/selectel/terraform
        run: |
          set -euo pipefail
          PUBLIC_IP="$(terraform output -raw public_ip)"
          echo "Setting PTR for ${PUBLIC_IP} -> ${RELAY_HOSTNAME}"
          HTTP_CODE="$(curl -sS -o ptr-response.json -w "%{http_code}" \
            -X POST "https://api.selectel.ru/domains/v1/ptr" \
            -H "X-Token: ${SELECTEL_STATIC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"ip\":\"${PUBLIC_IP}\",\"content\":\"${RELAY_HOSTNAME}\",\"ttl\":86400}")"
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
            echo "PTR created or updated"
          elif [ "${HTTP_CODE}" = "409" ]; then
            echo "::warning::PTR already exists for this IP — update manually in IP-адреса if hostname differs"
          else
            echo "::error::PTR API returned HTTP ${HTTP_CODE}"
            cat ptr-response.json || true
            exit 1
          fi

      - name: Summary
        if: inputs.action == 'apply'
        working-directory: infra/selectel/terraform
        run: |
          set -euo pipefail
          PUBLIC_IP="$(terraform output -raw public_ip)"
          echo "## Relay VM provisioned" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Output | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|--------|-------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| public_ip | \`${PUBLIC_IP}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| relay_hostname | \`${{ secrets.RELAY_HOSTNAME }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Next: DNS A record \`${{ secrets.RELAY_HOSTNAME }}\` -> \`${PUBLIC_IP}\`, then run **Deploy Relay** workflow." >> "${GITHUB_STEP_SUMMARY}"
