name: Provision Relay Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      set_ptr:
        description: Create/update PTR after apply (requires floating IP)
        required: false
        type: boolean
        default: true
      set_dns_a:
        description: Upsert A record in Selectel DNS after apply (zone must exist in panel)
        required: false
        type: boolean
        default: true
      flavor_id:
        description: Selectel flavor ID override (pool-specific; empty = auto-resolve 2 vCPU / 4096 MB / disk 0 via Nova API)
        required: false
        type: string
        default: ""

concurrency:
  group: provision-relay-infra
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform-${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: relay
    defaults:
      run:
        working-directory: infra/selectel/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Write S3 backend config
        env:
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: bash infra/selectel/scripts/write-terraform-backend-ci.sh

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.ci.hcl
          rm -f backend.ci.hcl

      - name: Prepare OpenStack credentials
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'
        working-directory: ${{ github.workspace }}
        env:
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
          RELAY_DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_flavor_id: ${{ inputs.flavor_id }}
        run: bash infra/selectel/scripts/prepare-openstack-env.sh

      - name: Verify OpenStack authentication
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'
        working-directory: ${{ github.workspace }}
        run: bash infra/selectel/scripts/verify-openstack-auth.sh

      - name: Resolve relay flavor
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'
        working-directory: ${{ github.workspace }}
        env:
          TF_VAR_flavor_id: ${{ inputs.flavor_id }}
        run: bash infra/selectel/scripts/resolve-relay-flavor.sh

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          set -euo pipefail
          terraform plan -out=tfplan -no-color | tee plan.txt

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Set PTR record
        if: inputs.action == 'apply' && inputs.set_ptr
        env:
          SELECTEL_STATIC_TOKEN: ${{ secrets.SELECTEL_STATIC_TOKEN }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
        working-directory: infra/selectel/terraform
        run: |
          set -euo pipefail
          PUBLIC_IP="$(terraform output -raw public_ip)"
          echo "Setting PTR for ${PUBLIC_IP} -> ${RELAY_HOSTNAME}"
          HTTP_CODE="$(curl -sS -o ptr-response.json -w "%{http_code}" \
            -X POST "https://api.selectel.ru/domains/v1/ptr" \
            -H "X-Token: ${SELECTEL_STATIC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"ip\":\"${PUBLIC_IP}\",\"content\":\"${RELAY_HOSTNAME}\",\"ttl\":86400}")"
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
            echo "PTR created or updated"
          elif [ "${HTTP_CODE}" = "409" ]; then
            echo "::warning::PTR already exists for this IP — update manually in IP-адреса if hostname differs"
          else
            echo "::error::PTR API returned HTTP ${HTTP_CODE}"
            cat ptr-response.json || true
            exit 1
          fi

      - name: Upsert DNS A record (Selectel DNS)
        if: inputs.action == 'apply' && inputs.set_dns_a
        working-directory: ${{ github.workspace }}
        env:
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          RELAY_DNS_ZONE: ${{ secrets.RELAY_DNS_ZONE }}
        run: |
          set -euo pipefail
          PUBLIC_IP="$(terraform -chdir=infra/selectel/terraform output -raw public_ip)"
          export PUBLIC_IP
          bash infra/selectel/scripts/upsert-relay-dns-a.sh

      - name: Summary
        if: inputs.action == 'apply'
        working-directory: infra/selectel/terraform
        run: |
          set -euo pipefail
          PUBLIC_IP="$(terraform output -raw public_ip)"
          echo "## Relay VM provisioned" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Output | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|--------|-------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| public_ip | \`${PUBLIC_IP}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| relay_hostname | \`${{ secrets.RELAY_HOSTNAME }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${{ inputs.set_dns_a }}" = "true" ]; then
            echo "DNS **A** \`${{ secrets.RELAY_HOSTNAME }}\` → \`${PUBLIC_IP}\` upserted via Selectel DNS API (if zone exists)." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "DNS A skipped (\`set_dns_a=false\`). Upsert manually or re-run apply with \`set_dns_a=true\`." >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Next: run **Deploy Relay** workflow (\`deploy\` or \`all\`)." >> "${GITHUB_STEP_SUMMARY}"
