name: Deploy Acurast Example Smoke Mainnet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only (no on-chain deploy)
        required: false
        type: boolean
        default: true
      max_cost_per_execution:
        description: "Max reward per execution in ACU base units (default: 0.05 ACU)"
        required: false
        type: string
        default: "50000000000"

concurrency:
  group: deploy-acurast-example-smoke-mainnet
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-acurast-example-smoke-mainnet
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Install and bundle
        run: |
          docker compose run --rm dev npm ci --prefix modules/acurast-example-smoke
          docker compose run --rm dev npm run bundle --prefix modules/acurast-example-smoke

      - name: Apply mainnet smoke config
        env:
          MAX_COST_PER_EXECUTION: ${{ inputs.max_cost_per_execution }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const configPath = "modules/acurast-example-smoke/acurast.json";
          const maxCost = Number(process.env.MAX_COST_PER_EXECUTION);
          if (!Number.isSafeInteger(maxCost) || maxCost <= 0) {
            throw new Error(`Invalid max_cost_per_execution: ${process.env.MAX_COST_PER_EXECUTION}`);
          }

          const config = JSON.parse(readFileSync(configPath, "utf8"));
          const project = config.projects["acurast-example-smoke"];
          project.network = "mainnet";
          project.onlyAttestedDevices = false;
          project.mutability = "Mutable";
          project.execution = {
            ...project.execution,
            type: "onetime",
            maxExecutionTimeInMs: 300000,
          };
          project.maxAllowedStartDelayInMs = 300000;
          project.maxCostPerExecution = maxCost;
          writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          git diff -- modules/acurast-example-smoke/acurast.json

      - name: Write module .env from mainnet secret
        env:
          MNEMONIC_MAINNET: ${{ secrets.ACURAST_MNEMONIC_MAINNET }}
        run: |
          set -euo pipefail
          if [ -z "${MNEMONIC_MAINNET:-}" ]; then
            echo "::error::Missing ACURAST_MNEMONIC_MAINNET in environment mainnet" >&2
            exit 1
          fi

          {
            printf 'ACURAST_MNEMONIC=%s\n' "${MNEMONIC_MAINNET}"
            printf 'ACURAST_RPC=wss://public-rpc.mainnet.acurast.com\n'
            printf 'ACURAST_MAINNET_RPC=wss://public-rpc.mainnet.acurast.com\n'
            printf 'WEBHOOK_URL=__NHMIND_NO_WEBHOOK__\n'
          } > modules/acurast-example-smoke/.env

      - name: Estimate fee
        env:
          ACURAST_NETWORK: mainnet
          ACURAST_RPC: wss://public-rpc.mainnet.acurast.com
        run: |
          docker compose run --rm \
            -e ACURAST_RPC="${ACURAST_RPC}" \
            -e ACURAST_MAINNET_RPC="${ACURAST_RPC}" \
            dev bash -lc "cd modules/acurast-example-smoke && acurast estimate-fee"

      - name: Deploy to Acurast mainnet
        id: acurast_deploy
        env:
          ACURAST_NETWORK: mainnet
          ACURAST_RPC: wss://public-rpc.mainnet.acurast.com
          ACURAST_DEPLOY_TIMEOUT_SEC: "300"
        run: |
          set -euo pipefail
          set +e
          deploy_out="$(bash scripts/deploy-canary-acurast.sh acurast-example-smoke "${{ inputs.dry_run }}")"
          deploy_exit=$?
          set -e
          printf '%s\n' "${deploy_out}"
          if [ "${deploy_exit}" -ne 0 ]; then
            exit "${deploy_exit}"
          fi
          deployment_id="$(printf '%s\n' "${deploy_out}" | grep -E '^deployment_id=' | tail -1 | cut -d= -f2- || true)"
          if [ -n "${deployment_id}" ]; then
            echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
            echo "Parsed deployment_id=${deployment_id}"
          else
            echo "::warning::Could not parse deployment ID from acurast deploy output"
          fi

      - name: Inspect deployment (SDK + CLI, registered)
        if: inputs.dry_run == false && steps.acurast_deploy.outputs.deployment_id != ''
        env:
          ACURAST_NETWORK: mainnet
          ACURAST_RPC: wss://public-rpc.mainnet.acurast.com
        run: |
          bash scripts/inspect-canary-deployments.sh \
            acurast-example-smoke \
            "${{ steps.acurast_deploy.outputs.deployment_id }}" \
            || echo "::warning::Deployment status inspect failed (registered)"

      - name: Upload Acurast deployment files
        if: inputs.dry_run == false && steps.acurast_deploy.outputs.deployment_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: acurast-mainnet-deploy-acurast-example-smoke-${{ steps.acurast_deploy.outputs.deployment_id }}
          path: modules/acurast-example-smoke/.acurast/deploy/
          if-no-files-found: warn

      - name: Acurast CLI deployment detail
        if: inputs.dry_run == false && steps.acurast_deploy.outputs.deployment_id != ''
        env:
          ACURAST_NETWORK: mainnet
          ACURAST_RPC: wss://public-rpc.mainnet.acurast.com
        run: |
          bash scripts/inspect-canary-deployment-cli.sh \
            acurast-example-smoke \
            "${{ steps.acurast_deploy.outputs.deployment_id }}" \
            || echo "::warning::CLI deployment detail failed"

      - name: Inspect deployment post-window
        if: inputs.dry_run == false && steps.acurast_deploy.outputs.deployment_id != ''
        env:
          ACURAST_NETWORK: mainnet
          ACURAST_RPC: wss://public-rpc.mainnet.acurast.com
          WAIT_BEFORE_INSPECT_SEC: "690"
          INSPECT_EXECUTION_MARGIN_SEC: "330"
        run: |
          set -euo pipefail
          wait_sec="${WAIT_BEFORE_INSPECT_SEC}"
          if [ -f /tmp/acurast-deploy.log ]; then
            scheduled="$(grep -oE 'first execution scheduled in [0-9]+s' /tmp/acurast-deploy.log | tail -1 | grep -oE '[0-9]+' || true)"
            if [ -n "${scheduled}" ]; then
              wait_sec=$((scheduled + INSPECT_EXECUTION_MARGIN_SEC))
              echo "Parsed first execution in ${scheduled}s -> waiting ${wait_sec}s before post-window inspect"
            fi
          fi
          echo "Waiting ${wait_sec}s before post-window inspect..."
          sleep "${wait_sec}"
          bash scripts/inspect-canary-deployments.sh \
            acurast-example-smoke \
            "${{ steps.acurast_deploy.outputs.deployment_id }}"
