name: Validate Relay Secrets

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which secrets to require
        required: true
        type: choice
        options:
          - provision
          - deploy
          - all

concurrency:
  group: validate-relay-secrets
  cancel-in-progress: false

jobs:
  validate:
    name: validate-${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Secret location hint
        run: |
          echo "Environment secrets: Settings → Environments → relay → Environment secrets"

      - name: Setup Terraform
        if: inputs.stage == 'deploy' || inputs.stage == 'all'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check presence and format (values are never printed)
        env:
          STAGE: ${{ inputs.stage }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
          RELAY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PRIVATE_KEY }}
          RELAY_DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          RELAY_TLS_KNOX_CERT_ID: ${{ secrets.RELAY_TLS_KNOX_CERT_ID }}
          SELECTEL_STATIC_TOKEN: ${{ secrets.SELECTEL_STATIC_TOKEN }}
        run: |
          set -euo pipefail
          bash infra/selectel/scripts/validate-relay-secrets.sh

      - name: Verify SSH deploy keypair
        if: inputs.stage == 'provision' || inputs.stage == 'deploy' || inputs.stage == 'all'
        env:
          RELAY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PRIVATE_KEY }}
          RELAY_DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
        run: bash infra/selectel/scripts/verify-ssh-keypair.sh

      - name: Verify Terraform state S3
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: bash infra/selectel/scripts/verify-tf-state-s3.sh

      - name: Verify OpenStack authentication
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: |
          set -euo pipefail
          export PREPARE_OPENSTACK_EXPORT=1
          # shellcheck disable=SC1091
          source infra/selectel/scripts/prepare-openstack-env.sh
          bash infra/selectel/scripts/verify-openstack-auth.sh

      - name: Verify Selectel static token
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          SELECTEL_STATIC_TOKEN: ${{ secrets.SELECTEL_STATIC_TOKEN }}
        run: bash infra/selectel/scripts/verify-selectel-static-token.sh

      - name: Verify Selectel DNS API auth
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_IAM_PROJECT_NAME: ${{ secrets.SELECTEL_IAM_PROJECT_NAME }}
          RELAY_DNS_ZONE_ID: ${{ secrets.RELAY_DNS_ZONE_ID }}
        run: |
          set -euo pipefail
          export PREPARE_OPENSTACK_EXPORT=1
          # shellcheck disable=SC1091
          source infra/selectel/scripts/prepare-openstack-env.sh
          bash infra/selectel/scripts/verify-selectel-dns-auth.sh

      - name: Resolve relay public IP from Terraform state
        if: inputs.stage == 'deploy' || inputs.stage == 'all'
        id: relay_host
        env:
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: |
          set -euo pipefail
          PUBLIC_IP="$(bash infra/selectel/scripts/read-relay-public-ip.sh)"
          echo "public_ip=${PUBLIC_IP}" >> "${GITHUB_OUTPUT}"
          echo "Resolved relay SSH target from terraform: deploy@${PUBLIC_IP}"

      - name: Verify Selectel LE API auth
        if: inputs.stage == 'deploy' || inputs.stage == 'all'
        env:
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_IAM_PROJECT_NAME: ${{ secrets.SELECTEL_IAM_PROJECT_NAME }}
        run: |
          set -euo pipefail
          export PREPARE_OPENSTACK_EXPORT=1
          # shellcheck disable=SC1091
          source infra/selectel/scripts/prepare-openstack-env.sh
          bash infra/selectel/scripts/verify-selectel-le-auth.sh

      - name: Verify relay SSH access
        if: inputs.stage == 'deploy' || inputs.stage == 'all'
        env:
          RELAY_SSH_HOST: ${{ steps.relay_host.outputs.public_ip }}
          RELAY_SSH_USER: deploy
          RELAY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PRIVATE_KEY }}
        run: bash infra/selectel/scripts/verify-ssh-deploy.sh

      - name: Summary
        run: |
          echo "All format and live credential checks passed for stage: ${{ inputs.stage }}"
