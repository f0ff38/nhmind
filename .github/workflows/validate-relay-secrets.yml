name: Validate Relay Secrets

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which secrets to require
        required: true
        type: choice
        options:
          - provision
          - deploy
          - all

concurrency:
  group: validate-relay-secrets
  cancel-in-progress: false

jobs:
  validate:
    name: validate-${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Secret location hint
        run: |
          echo "Environment secrets: Settings → Environments → relay → Environment secrets"

      - name: Setup Terraform
        if: inputs.stage == 'deploy' || inputs.stage == 'all'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check presence and format (values are never printed)
        env:
          STAGE: ${{ inputs.stage }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
          RELAY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PRIVATE_KEY }}
          RELAY_DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          SELECTEL_STATIC_TOKEN: ${{ secrets.SELECTEL_STATIC_TOKEN }}
        run: |
          set -euo pipefail

          require() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing or empty secret: $name"
              return 1
            fi
            return 0
          }

          fail_format() {
            local name="$1"
            local hint="$2"
            echo "::error::Invalid format for $name ($hint)"
            return 1
          }

          errors=0

          check_required() {
            local name="$1"
            local value="$2"
            if ! require "$name" "$value"; then
              errors=$((errors + 1))
            fi
          }

          # --- provision ---
          if [ "$STAGE" = provision ] || [ "$STAGE" = all ]; then
            echo "Checking provision secrets (format)..."
            check_required SELECTEL_SERVICE_USER "$SELECTEL_SERVICE_USER"
            check_required SELECTEL_SERVICE_PASSWORD "$SELECTEL_SERVICE_PASSWORD"
            check_required SELECTEL_ACCOUNT_ID "$SELECTEL_ACCOUNT_ID"
            check_required SELECTEL_PROJECT_ID "$SELECTEL_PROJECT_ID"
            check_required RELAY_DEPLOY_SSH_PRIVATE_KEY "$RELAY_DEPLOY_SSH_PRIVATE_KEY"
            check_required RELAY_DEPLOY_SSH_PUBLIC_KEY "$RELAY_DEPLOY_SSH_PUBLIC_KEY"
            check_required TF_STATE_S3_BUCKET "$TF_STATE_S3_BUCKET"
            check_required TF_STATE_S3_ACCESS_KEY "$TF_STATE_S3_ACCESS_KEY"
            check_required TF_STATE_S3_SECRET_KEY "$TF_STATE_S3_SECRET_KEY"
            check_required RELAY_HOSTNAME "$RELAY_HOSTNAME"
            check_required SELECTEL_STATIC_TOKEN "$SELECTEL_STATIC_TOKEN"

            check_required SELECTEL_AVAILABILITY_ZONE "$SELECTEL_AVAILABILITY_ZONE"
            if [ -n "$SELECTEL_AVAILABILITY_ZONE" ]; then
              if printf '%s' "$SELECTEL_AVAILABILITY_ZONE" | grep -Eq '^[a-z]{2,4}-[0-9]+[a-z]$'; then
                echo "SELECTEL_AVAILABILITY_ZONE: OK - pool AZ, e.g. ru-3a"
              elif printf '%s' "$SELECTEL_AVAILABILITY_ZONE" | grep -Eq '^[a-z]{2,4}-[0-9]+$'; then
                echo "::warning::SELECTEL_AVAILABILITY_ZONE is a pool (e.g. ru-3), not an AZ. For VM creation use ru-3a / ru-3b from the server wizard."
              else
                fail_format SELECTEL_AVAILABILITY_ZONE "expected pool (ru-3) or AZ (ru-3a)" || errors=$((errors + 1))
              fi
            fi

            if [ -n "$SELECTEL_ACCOUNT_ID" ] && ! printf '%s' "$SELECTEL_ACCOUNT_ID" | grep -Eq '^[0-9]+$'; then
              fail_format SELECTEL_ACCOUNT_ID "expected numeric account id" || errors=$((errors + 1))
            fi

            if [ -n "$SELECTEL_PROJECT_ID" ]; then
              pid_hex="$(printf '%s' "$SELECTEL_PROJECT_ID" | tr 'A-Z' 'a-z' | sed 's/[^0-9a-f]//g')"
              pid_len="${#pid_hex}"
              if [ "$pid_len" -eq 32 ]; then
                echo "SELECTEL_PROJECT_ID: OK - 32 hex chars, cloud project id"
              else
                echo "::error::SELECTEL_PROJECT_ID: after cleanup got ${pid_len} hex chars, need 32. Use Cloud servers project id, not IAM Projects."
                errors=$((errors + 1))
              fi
            fi

            if [ -n "$RELAY_HOSTNAME" ] && ! printf '%s' "$RELAY_HOSTNAME" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'; then
              fail_format RELAY_HOSTNAME "expected lowercase FQDN without scheme" || errors=$((errors + 1))
            fi

            if [ -n "$RELAY_DEPLOY_SSH_PRIVATE_KEY" ] && ! printf '%s' "$RELAY_DEPLOY_SSH_PRIVATE_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
              fail_format RELAY_DEPLOY_SSH_PRIVATE_KEY "expected PEM private key" || errors=$((errors + 1))
            fi

            if [ -n "$RELAY_DEPLOY_SSH_PUBLIC_KEY" ] && ! printf '%s' "$RELAY_DEPLOY_SSH_PUBLIC_KEY" | grep -Eq '^(ssh-(rsa|ed25519)|ecdsa-)'; then
              fail_format RELAY_DEPLOY_SSH_PUBLIC_KEY "expected OpenSSH public key line" || errors=$((errors + 1))
            fi
          fi

          # --- deploy (after VM exists) ---
          if [ "$STAGE" = deploy ] || [ "$STAGE" = all ]; then
            echo "Checking deploy secrets (format)..."
            check_required TF_STATE_S3_BUCKET "$TF_STATE_S3_BUCKET"
            check_required TF_STATE_S3_ACCESS_KEY "$TF_STATE_S3_ACCESS_KEY"
            check_required TF_STATE_S3_SECRET_KEY "$TF_STATE_S3_SECRET_KEY"
            check_required RELAY_DEPLOY_SSH_PRIVATE_KEY "$RELAY_DEPLOY_SSH_PRIVATE_KEY"
            check_required RELAY_HOSTNAME "$RELAY_HOSTNAME"
            echo "RELAY_SSH_HOST: resolved at runtime from terraform output public_ip (not a GitHub secret)"
          fi

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "Fix secrets in GitHub → Settings → Environments → relay"
            exit 1
          fi

          echo "Format checks passed for stage: $STAGE"

      - name: Verify SSH deploy keypair
        if: inputs.stage == 'provision' || inputs.stage == 'deploy' || inputs.stage == 'all'
        env:
          RELAY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PRIVATE_KEY }}
          RELAY_DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PUBLIC_KEY }}
        run: bash infra/selectel/scripts/verify-ssh-keypair.sh

      - name: Verify Terraform state S3
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: bash infra/selectel/scripts/verify-tf-state-s3.sh

      - name: Verify OpenStack authentication
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: |
          set -euo pipefail
          export PREPARE_OPENSTACK_EXPORT=1
          # shellcheck disable=SC1091
          source infra/selectel/scripts/prepare-openstack-env.sh
          bash infra/selectel/scripts/verify-openstack-auth.sh

      - name: Verify Selectel static token
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          SELECTEL_STATIC_TOKEN: ${{ secrets.SELECTEL_STATIC_TOKEN }}
        run: bash infra/selectel/scripts/verify-selectel-static-token.sh

      - name: Verify Selectel DNS API auth
        if: inputs.stage == 'provision' || inputs.stage == 'all'
        env:
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_IAM_PROJECT_NAME: ${{ secrets.SELECTEL_IAM_PROJECT_NAME }}
        run: |
          set -euo pipefail
          export PREPARE_OPENSTACK_EXPORT=1
          # shellcheck disable=SC1091
          source infra/selectel/scripts/prepare-openstack-env.sh
          bash infra/selectel/scripts/verify-selectel-dns-auth.sh

      - name: Resolve relay public IP from Terraform state
        if: inputs.stage == 'deploy' || inputs.stage == 'all'
        id: relay_host
        env:
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: |
          set -euo pipefail
          PUBLIC_IP="$(bash infra/selectel/scripts/read-relay-public-ip.sh)"
          echo "public_ip=${PUBLIC_IP}" >> "${GITHUB_OUTPUT}"
          echo "Resolved relay SSH target from terraform: deploy@${PUBLIC_IP}"

      - name: Verify relay SSH access
        if: inputs.stage == 'deploy' || inputs.stage == 'all'
        env:
          RELAY_SSH_HOST: ${{ steps.relay_host.outputs.public_ip }}
          RELAY_SSH_USER: deploy
          RELAY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PRIVATE_KEY }}
        run: bash infra/selectel/scripts/verify-ssh-deploy.sh

      - name: Summary
        run: |
          echo "All format and live credential checks passed for stage: ${{ inputs.stage }}"
