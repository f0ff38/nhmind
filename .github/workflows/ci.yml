name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-nostr-client:
    name: verify-nostr-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Install dependencies
        run: docker compose run --rm dev npm ci --prefix packages/nostr-client

      - name: Build
        run: docker compose run --rm dev npm run build --prefix packages/nostr-client

      - name: Unit tests
        run: docker compose run --rm dev npm test --prefix packages/nostr-client

      - name: Start nostr-relay
        run: docker compose --profile relay up -d nostr-relay

      - name: Wait for relay
        run: sleep 5

      - name: Integration tests
        run: docker compose run --rm dev npm run test:integration --prefix packages/nostr-client

  verify:
    name: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [hello, coordinator, module-template, oracle-feed]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Install and build nostr-client
        run: |
          docker compose run --rm dev npm ci --prefix packages/nostr-client
          docker compose run --rm dev npm run build --prefix packages/nostr-client

      - name: Install dependencies
        run: docker compose run --rm dev npm ci --prefix modules/${{ matrix.module }}

      - name: Unit tests
        run: docker compose run --rm dev npm test --prefix modules/${{ matrix.module }}

      - name: Bundle
        run: docker compose run --rm dev npm run bundle --prefix modules/${{ matrix.module }}

      - name: Smoke run (mock _STD_)
        run: docker compose run --rm dev npm run start:local --prefix modules/${{ matrix.module }}

  scaffold:
    name: verify-new-module-script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Create module from template
        run: ./scripts/new-module.sh ci-scaffold-smoke

      - name: Test scaffolded module
        run: |
          docker compose run --rm dev npm ci --prefix modules/ci-scaffold-smoke
          docker compose run --rm dev npm test --prefix modules/ci-scaffold-smoke
          docker compose run --rm dev npm run bundle --prefix modules/ci-scaffold-smoke
