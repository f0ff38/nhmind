name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dev image
        run: docker compose build dev

      - name: Install dependencies
        run: docker compose run --rm dev npm ci --prefix modules/hello

      - name: Unit tests
        run: docker compose run --rm dev npm test --prefix modules/hello

      - name: Bundle
        run: docker compose run --rm dev npm run bundle --prefix modules/hello

      - name: Smoke run (mock _STD_)
        run: docker compose run --rm dev npm run start:local --prefix modules/hello
