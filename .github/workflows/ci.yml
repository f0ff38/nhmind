name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-nostr-client:
    name: verify-nostr-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: ./scripts/dev compose build dev

      - name: Install dependencies
        run: NHIND_MODULE_DIR=packages/nostr-client ./scripts/dev install

      - name: Unit tests
        run: NHIND_MODULE_DIR=packages/nostr-client ./scripts/dev test

      - name: Start nostr-relay
        run: ./scripts/dev up

      - name: Wait for relay
        run: sleep 5

      - name: Integration tests
        run: ./scripts/dev test:integration

  verify:
    name: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [hello, coordinator, module-template, oracle-feed]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: ./scripts/dev compose build dev

      - name: Install and build nostr-client
        run: NHIND_MODULE_DIR=modules/${{ matrix.module }} ./scripts/dev install

      - name: Unit tests
        run: NHIND_MODULE_DIR=modules/${{ matrix.module }} ./scripts/dev test

      - name: Bundle
        run: NHIND_MODULE_DIR=modules/${{ matrix.module }} ./scripts/dev bundle

      - name: Smoke run (mock _STD_)
        run: NHIND_MODULE_DIR=modules/${{ matrix.module }} ./scripts/dev run

  verify-acurast-example-smoke:
    name: verify-acurast-example-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: ./scripts/dev compose build dev

      - name: Install dependencies
        run: NHIND_MODULE_DIR=modules/acurast-example-smoke ./scripts/dev install

      - name: Typecheck
        run: NHIND_MODULE_DIR=modules/acurast-example-smoke ./scripts/dev test

      - name: Bundle
        run: NHIND_MODULE_DIR=modules/acurast-example-smoke ./scripts/dev bundle

      - name: Fast local smoke
        run: |
          docker compose run --rm \
            -e EXAMPLE_SMOKE_SKIP_NETWORK=1 \
            -e EXAMPLE_SMOKE_SCALE=0 \
            dev npm run start:local --prefix modules/acurast-example-smoke

  scaffold:
    name: verify-new-module-script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: ./scripts/dev compose build dev

      - name: Create module from template
        run: ./scripts/new-module.sh ci-scaffold-smoke

      - name: Test scaffolded module
        run: |
          NHIND_MODULE_DIR=modules/ci-scaffold-smoke ./scripts/dev install
          NHIND_MODULE_DIR=modules/ci-scaffold-smoke ./scripts/dev test
          NHIND_MODULE_DIR=modules/ci-scaffold-smoke ./scripts/dev bundle
