name: Inspect Canary Deployment

on:
  workflow_dispatch:
    inputs:
      module:
        description: Acurast module (uses modules/<name>/.env mnemonic)
        required: true
        type: choice
        options:
          - hello
          - coordinator
      deployment_id:
        description: Hub deployment number (e.g. 378421); leave empty to list only
        required: false
        type: string
        default: ""
      deploy_run_id:
        description: Optional Deploy Canary run ID to download .acurast artifact (needs deployment_id)
        required: false
        type: string
        default: ""

jobs:
  inspect:
    name: inspect-${{ inputs.module }}${{ inputs.deployment_id && format('-{0}', inputs.deployment_id) || '' }}
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Download deployment artifact
        if: inputs.deploy_run_id != '' && inputs.deployment_id != ''
        uses: actions/download-artifact@v4
        with:
          name: acurast-deploy-${{ inputs.module }}-${{ inputs.deployment_id }}
          path: modules/${{ inputs.module }}/.acurast/deploy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.deploy_run_id }}

      - name: Write module .env from secrets
        env:
          MNEMONIC_HELLO: ${{ secrets.ACURAST_MNEMONIC_HELLO }}
          MNEMONIC_COORDINATOR: ${{ secrets.ACURAST_MNEMONIC_COORDINATOR }}
          MNEMONIC_FALLBACK: ${{ secrets.ACURAST_MNEMONIC }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
        run: |
          set -euo pipefail
          MODULE="${{ inputs.module }}"
          case "${MODULE}" in
            hello) MNEMONIC="${MNEMONIC_HELLO:-${MNEMONIC_FALLBACK:-}}" ;;
            coordinator) MNEMONIC="${MNEMONIC_COORDINATOR:-${MNEMONIC_FALLBACK:-}}" ;;
            *) echo "Unknown module: ${MODULE}" >&2; exit 1 ;;
          esac
          if [ -z "${MNEMONIC}" ]; then
            echo "Missing mnemonic secret for ${MODULE}." >&2
            exit 1
          fi
          ENV_FILE="modules/${MODULE}/.env"
          printf 'ACURAST_MNEMONIC=%s\n' "${MNEMONIC}" > "${ENV_FILE}"
          printf 'ACURAST_RPC=wss://public-rpc.canary.acurast.com\n' >> "${ENV_FILE}"
          printf 'ACURAST_CANARY_RPC=wss://public-rpc.canary.acurast.com\n' >> "${ENV_FILE}"
          printf 'ACURAST_CANARY_INDEXER=https://dev.indexer.canary.acurast.com/api/v1/rpc\n' >> "${ENV_FILE}"
          printf 'ACURAST_CANARY_INDEXER_API_KEY=OXuwySHqNSlwwa_qqB-cBw\n' >> "${ENV_FILE}"
          if [ -n "${RELAY_HOSTNAME:-}" ]; then
            relay_hostname="$(printf '%s' "${RELAY_HOSTNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s|/$||')"
            printf 'RELAY_URL=wss://%s/\n' "${relay_hostname}" >> "${ENV_FILE}"
          fi

      - name: Inspect via SDK + CLI
        env:
          INSPECT_DEPLOYMENTS_FAIL: "1"
          ACURAST_RPC_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "# Inspect Canary Deployment"
              echo ""
              echo "- **Module:** \`${{ inputs.module }}\`"
              if [ -n "${{ inputs.deployment_id }}" ]; then
                echo "- **Deployment ID:** \`${{ inputs.deployment_id }}\`"
              fi
              if [ -n "${{ inputs.deploy_run_id }}" ]; then
                echo "- **Artifact from run:** \`${{ inputs.deploy_run_id }}\`"
              fi
              echo ""
              echo "Diagnostics: SDK (indexer + RPC) + optional \`acurast deployments <id>\` when local \`.acurast/deploy\` file exists."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          args=("${{ inputs.module }}")
          if [ -n "${{ inputs.deployment_id }}" ]; then
            args+=("${{ inputs.deployment_id }}")
          fi
          bash scripts/inspect-canary-deployments.sh "${args[@]}"
