name: Inspect Canary Deployments

on:
  workflow_dispatch:
    inputs:
      module:
        description: Acurast module (uses modules/<name>/.env mnemonic)
        required: true
        type: choice
        options:
          - hello
          - coordinator
      deployment_id:
        description: Hub deployment number (e.g. 378420); leave empty to list only
        required: false
        type: string
        default: ""

jobs:
  inspect:
    name: inspect-deployments-${{ inputs.module }}
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dev image
        run: docker compose build dev

      - name: Write module .env from secrets
        env:
          MNEMONIC_HELLO: ${{ secrets.ACURAST_MNEMONIC_HELLO }}
          MNEMONIC_COORDINATOR: ${{ secrets.ACURAST_MNEMONIC_COORDINATOR }}
          MNEMONIC_FALLBACK: ${{ secrets.ACURAST_MNEMONIC }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
        run: |
          set -euo pipefail
          MODULE="${{ inputs.module }}"
          case "${MODULE}" in
            hello) MNEMONIC="${MNEMONIC_HELLO:-${MNEMONIC_FALLBACK:-}}" ;;
            coordinator) MNEMONIC="${MNEMONIC_COORDINATOR:-${MNEMONIC_FALLBACK:-}}" ;;
            *) echo "Unknown module: ${MODULE}" >&2; exit 1 ;;
          esac
          if [ -z "${MNEMONIC}" ]; then
            echo "Missing mnemonic secret for ${MODULE}." >&2
            exit 1
          fi
          ENV_FILE="modules/${MODULE}/.env"
          printf 'ACURAST_MNEMONIC=%s\n' "${MNEMONIC}" > "${ENV_FILE}"
          if [ -n "${RELAY_HOSTNAME:-}" ]; then
            relay_hostname="$(printf '%s' "${RELAY_HOSTNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s|/$||')"
            printf 'RELAY_URL=wss://%s/\n' "${relay_hostname}" >> "${ENV_FILE}"
          fi

      - name: Query deployments via Acurast CLI
        env:
          INSPECT_DEPLOYMENTS_FAIL: "1"
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "# Inspect Canary Deployments"
              echo ""
              echo "- **Module:** \`${{ inputs.module }}\`"
              if [ -n "${{ inputs.deployment_id }}" ]; then
                echo "- **Deployment ID:** \`${{ inputs.deployment_id }}\`"
              fi
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          args=("${{ inputs.module }}")
          if [ -n "${{ inputs.deployment_id }}" ]; then
            args+=("${{ inputs.deployment_id }}")
          fi
          bash scripts/inspect-canary-deployments.sh "${args[@]}"
