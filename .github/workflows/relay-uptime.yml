name: Relay Uptime

on:
  workflow_dispatch:
    inputs:
      action:
        description: Smoke relay or refresh TLS then smoke
        required: true
        type: choice
        options:
          - smoke
          - renew-tls
        default: smoke
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: relay-uptime
  cancel-in-progress: false

jobs:
  relay:
    name: relay-uptime-${{ inputs.action || 'smoke' }}
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Resolve relay public IP from Terraform state
        id: relay_host
        env:
          TF_STATE_S3_BUCKET: ${{ secrets.TF_STATE_S3_BUCKET }}
          TF_STATE_S3_ACCESS_KEY: ${{ secrets.TF_STATE_S3_ACCESS_KEY }}
          TF_STATE_S3_SECRET_KEY: ${{ secrets.TF_STATE_S3_SECRET_KEY }}
          TF_STATE_S3_REGION: ${{ secrets.TF_STATE_S3_REGION }}
          SELECTEL_REGION: ${{ secrets.SELECTEL_REGION }}
          SELECTEL_AVAILABILITY_ZONE: ${{ secrets.SELECTEL_AVAILABILITY_ZONE }}
        run: |
          set -euo pipefail
          PUBLIC_IP="$(bash infra/selectel/scripts/read-relay-public-ip.sh)"
          echo "public_ip=${PUBLIC_IP}" >> "${GITHUB_OUTPUT}"

      - name: Renew TLS from Selectel Knox
        if: inputs.action == 'renew-tls'
        env:
          RELAY_SSH_HOST: ${{ steps.relay_host.outputs.public_ip }}
          RELAY_SSH_USER: deploy
          RELAY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.RELAY_DEPLOY_SSH_PRIVATE_KEY }}
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
          RELAY_TLS_KNOX_CERT_ID: ${{ secrets.RELAY_TLS_KNOX_CERT_ID }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
          SELECTEL_SERVICE_USER: ${{ secrets.SELECTEL_SERVICE_USER }}
          SELECTEL_SERVICE_PASSWORD: ${{ secrets.SELECTEL_SERVICE_PASSWORD }}
          SELECTEL_IAM_PROJECT_NAME: ${{ secrets.SELECTEL_IAM_PROJECT_NAME }}
        run: |
          set -euo pipefail
          export PREPARE_OPENSTACK_EXPORT=1
          # shellcheck disable=SC1091
          source infra/selectel/scripts/prepare-openstack-env.sh
          bash infra/nostr-relay/scripts/renew-tls.sh "${RELAY_SSH_HOST}" "${RELAY_HOSTNAME}"

      - name: Smoke relay
        env:
          RELAY_HOSTNAME: ${{ secrets.RELAY_HOSTNAME }}
        run: |
          set -euo pipefail
          bash infra/nostr-relay/scripts/smoke-relay.sh \
            "${RELAY_HOSTNAME}" \
            "${{ steps.relay_host.outputs.public_ip }}"
