#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - docker.io
  - ufw

users:
  - default
  - name: deploy
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      - ${deploy_ssh_public_key}

ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/99-nhmind.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - mkdir -p /opt/nhmind-relay
  - chown deploy:deploy /opt/nhmind-relay
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl restart ssh
