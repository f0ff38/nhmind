services:
  relay:
    image: scsibug/nostr-rs-relay:0.10.0
    user: "100:100"
    restart: unless-stopped
    volumes:
      - relay-data:/usr/src/app/db
      - ./config.toml:/usr/src/app/config.toml:ro
    expose:
      - "8080"

  http-bridge:
    build: ./http-bridge
    restart: unless-stopped
    environment:
      RELAY_WS_URL: ws://relay:8080
    expose:
      - "8090"
    depends_on:
      - relay

  nginx:
    image: nginx:1.30.2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - relay
      - http-bridge

volumes:
  relay-data:
