services:
  relay:
    image: scsibug/nostr-rs-relay:0.10.0
    restart: unless-stopped
    volumes:
      - relay-data:/usr/src/app/db
      - ./config.toml:/usr/src/app/config.toml:ro
    expose:
      - "8080"

  nginx:
    image: nginx:1.30.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - relay

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  relay-data:
  certbot-www:
  certbot-certs:
